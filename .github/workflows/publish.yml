name: Publish to NuGet

on:
  push:
    tags:
      - 'release/*'

permissions:
  contents: read

jobs:
  # Runs all third-party build and test code (npm, vite, vitest, NuGet) with read-only permissions, so none of it can
  # request the OIDC token that publishes.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      lines: ${{ steps.tag.outputs.lines }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # One branch carries both lines, so a tag publishes only from main.
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Version files match the tag
        run: bash build/check-release-version.sh "$GITHUB_REF_NAME"

      # A legacy tag (release/<minor>.<patch>) packs 17 and 18; a release/19.<minor>.<patch> tag packs 19 only.
      # The tag reaches the script through an env var, never inline.
      - name: Lines for this tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sfx='(-[0-9A-Za-z][0-9A-Za-z.-]*)?'
          if [[ "$TAG" =~ ^release/19\.[0-9]+\.[0-9]+${sfx}$ ]]; then
            lines="19"; pack_version="${TAG#release/}"
          elif [[ "$TAG" =~ ^release/[0-9]+\.[0-9]+${sfx}$ ]]; then
            lines="$(grep -E '^[0-9]+$' eng/lines.txt | grep -vx 19 | tr '\n' ' ')"; pack_version=""
          else
            echo "Unexpected tag $TAG" >&2; exit 1
          fi
          { echo "lines=$lines"; echo "pack_version=$pack_version"; echo "expected=$(wc -w <<<"$lines" | tr -d ' ')"; } >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/Umbraco.Community.BackofficeTidy/Client/.nvmrc

      # The same client gates as build.yml, so a tag never publishes a client that CI did not check.
      - name: Client build, XSS guard, tests and wwwroot drift
        run: |
          cd src/Umbraco.Community.BackofficeTidy/Client
          npm ci --ignore-scripts
          npm run build
          npm test
          cd ../../..
          bash build/check-xss.sh
          git diff --exit-code -- src/Umbraco.Community.BackofficeTidy/wwwroot
          test -z "$(git status --porcelain -- src/Umbraco.Community.BackofficeTidy/wwwroot)"

      # No NuGet cache here (cache: true is deliberately absent): a release never restores from a PR-filled cache.
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ steps.tag.outputs.lines == '19' && '11.x' || '10.x' }}

      # Each line this tag packs is restored (locked), built, tested and checked for known advisories before anything is packed.
      - name: Build, test and audit the lines
        env:
          LINES: ${{ steps.tag.outputs.lines }}
        run: |
          for line in $LINES; do
            echo "== Umbraco $line"
            dotnet restore src/Umbraco.Community.BackofficeTidy.slnx "-p:UmbracoMajor=$line" --locked-mode
            dotnet build src/Umbraco.Community.BackofficeTidy.slnx --no-restore -c Release "-p:UmbracoMajor=$line"
            dotnet test src/Umbraco.Community.BackofficeTidy.slnx --no-build -c Release "-p:UmbracoMajor=$line"
            UmbracoMajor="$line" bash build/check-vulnerable.sh
          done

      # One nupkg per line packed, each carrying wwwroot. Only the package is packed: tests and the demo site
      # are IsPackable=false. pack.sh stamps the line's version into the manifest and restores it afterwards.
      - name: Pack
        env:
          LINES: ${{ steps.tag.outputs.lines }}
          PACK_VERSION: ${{ steps.tag.outputs.pack_version }}
        run: bash build/pack.sh ./artifacts

      - name: Packages contain the client bundle
        env:
          EXPECTED: ${{ steps.tag.outputs.expected }}
        run: |
          shopt -s nullglob
          packs=(./artifacts/*.nupkg)
          [ "${#packs[@]}" -eq "$EXPECTED" ] || { echo "expected $EXPECTED nupkgs, found ${#packs[@]}" >&2; exit 1; }
          for f in "${packs[@]}"; do
            unzip -l "$f" | grep -q 'staticwebassets/index.js' || { echo "$f has no staticwebassets/index.js" >&2; exit 1; }
            # Per-line NuGet lock files must not ship in the package.
            listing="$(unzip -Z1 "$f")"
            case "$listing" in *lock.json*) echo "$f contains a lock file" >&2; exit 1;; esac
          done

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkgs
          path: ./artifacts/*.nupkg
          if-no-files-found: error

  # Holds the only step that can mint the OIDC token: it checks out nothing and runs no project code, only downloads
  # the packages the build job made and pushes them.
  publish:
    needs: build
    runs-on: ubuntu-latest
    # A required reviewer approves each publish; the environment only accepts release/* tags (see .github/REPO-SETUP.md).
    environment: nuget
    permissions:
      contents: read
      id-token: write # NuGet Trusted Publishing (OIDC): no long-lived API key

    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkgs
          path: ./artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ needs.build.outputs.lines == '19' && '11.x' || '10.x' }}

      # Needs the repository secret NUGET_USER (the nuget.org profile name, not a key) and a Trusted Publishing
      # policy on nuget.org for this repository and workflow file (see .github/REPO-SETUP.md).
      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

